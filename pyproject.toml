[project]
name = "tradingtool"
version = "0.1.0"
description = "Panel de apoyo a decisiones de inversión (IBKR paper): compras de insiders, diario y riesgo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ib_async>=2.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
tt = "tradingtool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingtool"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert en tests
    "RUF001", "RUF002", "RUF003",  # textos en español con tildes y signos
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test que requiere red real (SEC/IBKR); se omite por defecto",
]
