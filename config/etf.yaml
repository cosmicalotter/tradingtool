# Rotación de ETFs: reglas de rotacion-v1. Pre-registro: docs/ETF-ROTACION.md
# REGLA DE ORO: si cambias algo de este archivo (salvo "ucits" o el aporte mensual) después
# de ver resultados, ya no es rotacion-v1: cambia el nombre y evalúala con datos nuevos.

strategy_version: rotacion-v1

# Activos de riesgo (acciones): EE. UU., desarrollados fuera de EE. UU. y emergentes.
# En el backtest se usan ETF de EE. UU. como sustitutos porque tienen historia larga.
risk_assets: [SPY, EFA, EEM]

# Refugios: bonos del Tesoro de EE. UU. a 7-10 años y efectivo (letras del Tesoro, FRED DTB3).
defensive_assets: [IEF, CASH]
cash_asset: CASH

# Horizontes de momentum (meses). Cada uno decide una parte igual de la cartera.
horizons_months: [1, 3, 6, 12]

# La señal se calcula al cierre del último día hábil del mes y se ejecuta N días hábiles después.
execution_lag_days: 1

# No se toca un activo si su peso está a menos de 5 puntos del objetivo (ahorra comisiones).
rebalance_band: 0.05

benchmark: SPY
balanced_benchmark: {SPY: 0.6, IEF: 0.4}

costs:
  # IBKR Pro tiered en la Bolsa de Londres (ETF UCITS en USD). Verifica en IBKR antes de operar.
  min_fee_usd: 1.90 # mínimo por orden (~US$1,70 + bolsa y compensación)
  fee_rate: 0.0005 # 0,05% del valor de la orden
  slippage_bps: 10 # spread + deslizamiento por lado (conservador)
  capital_usd: 5000 # tamaño de cuenta supuesto para la comisión mínima
  sensitivity_capitals_usd: [1000, 5000, 20000]

verdict:
  max_drawdown_ratio: 0.6 # peor caída ≤ 60% de la de SPY
  min_neighbors_pass: 4 # de 6 variantes vecinas
  min_validation_months: 96
  bootstrap_samples: 2000
  bootstrap_block_months: 6
  seed: 7

# --- Solo para mostrar (no cambian resultados) ---
monthly_contribution_usd: 400

# ETF UCITS (Irlanda) para operar en IBKR. Bolsa de Londres, en USD, de acumulación.
# VERIFICA cada símbolo, la bolsa (LSE) y la moneda (USD) en IBKR antes de comprar.
ucits:
  SPY: VUAA # Vanguard S&P 500 UCITS (alternativa: CSPX, de precio por acción más alto)
  EFA: EXUS # Xtrackers MSCI World ex USA UCITS 1C
  EEM: EIMI # iShares Core MSCI EM IMI UCITS
  IEF: CBU0 # iShares $ Treasury Bond 7-10yr UCITS (Acc)
  CASH: IB01 # iShares $ Treasury Bond 0-1yr UCITS (Acc)
